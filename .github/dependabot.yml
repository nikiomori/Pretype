version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Package.swift and Package.resolved, at the root. A dependency pinned to
  # a revision (mlx-swift-lm, until its next tag) gets no update from this.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
