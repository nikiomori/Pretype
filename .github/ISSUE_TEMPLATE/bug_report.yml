name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! The menu-bar **Diagnostics** submenu and
        **Debug Console…** are the fastest way to capture what went wrong —
        please include their output where relevant.

        **This issue is public.** Debug Console lines contain text that you
        typed: suggestions, accepted words, corrections and model output.
        Remove or replace private text before you paste them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Focus a text field in …
        2. Type …
        3. …
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Which app were you typing in?
      placeholder: e.g. Mail, Slack, VS Code, Safari
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 26.0 / 27.0.1
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model & memory
      placeholder: e.g. MacBook Pro M3, 48 GB
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Which model was selected?
      options:
        - Gemma 4 E4B 8-bit — best quality
        - Gemma 4 E4B 6-bit — lighter, near-best
        - Gemma 4 E2B 8-bit — small but precise
        - Gemma 4 E2B — for 8–16 GB Macs
        - MiniCPM5 1B — fastest, English & Russian
        - Qwen2.5 0.5B — smallest footprint
        - Qwen3.5 2B — best small multilingual
        - Qwen3.5 2B M40 — one model for typing and fixes
        - Ternary Bonsai 4B — 1 GB base
        - Apple Intelligence — system model
        - Cloud API (Settings → API)
        - Other
        - Not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / Debug Console output
      description: >
        From the menu bar: the Diagnostics submenu lines, plus any relevant
        Debug Console events (focus, GATE/GEN, errors). This is the single most
        useful thing for triage. WARNING: this issue is public, and GATE/GEN
        lines contain fragments of text that you typed and model output.
        Remove or replace private text before you paste.
      render: text
  - type: input
    id: version
    attributes:
      label: Pretype version / commit
      placeholder: e.g. 2.7.0 or a git SHA
