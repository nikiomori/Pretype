name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A macOS runner bills at 10× a Linux one, so a superseded push must not keep
# building — only the newest commit on a ref matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Single source for the toolchain pin: the SwiftPM cache key has to move with
# it, or a .build restored from the previous Xcode fails to import its own
# modules — a poisoned cache that looks like a source error.
env:
  XCODE_VERSION: '26.6'

# `swift test` catches compile regressions on every PR. It does NOT exercise
# Scripts/make-app.sh — the xcodebuild/Metal path that produces the shipped
# bundle — so that runs on pushes to main only: cheap enough per merge, and it
# means the packaging path can't first break in the maintainer's release build
# (docs/RELEASING.md).
jobs:
  build:
    name: swift test (macOS)
    # mlx-swift 0.32.3 needs swift-tools 6.3: the macOS 26 image's default Xcode 26.6 has it.
    runs-on: macos-26
    # A hung test would otherwise bill the 6-hour default at the macOS rate.
    # A cold run (two module trees plus the Release bundle) fits well inside.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned so a runner-image toolchain bump can't break builds silently.
      # Floor is the macOS 26 SDK: FoundationModelsEngine imports the
      # FoundationModels framework, absent from Xcode 16.x. Bump deliberately.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # ponytail: swiftlint stays unpinned (brew) — a release that adds rules can
      # redden an unrelated PR. Pin the formula if that ever bites twice.
      # dist.sh never runs here (it needs the signing identity), so a syntax
      # error in it would first show in the maintainer's release build.
      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint --strict
          for script in Scripts/*.sh docs/diagrams/render.sh; do bash -n "$script"; done

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # The strings check builds a second tree under .build/l10n. An exact
          # key hit never saves again, so the script is in the key: a change
          # to it saves a cache that holds that build too.
          key: spm-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ hashFiles('Package.resolved', 'Scripts/sync-strings.py') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      # Metal shader compilation is a separate component on Xcode 26+; a no-op
      # on older Xcodes. Tolerated if it isn't available on the runner.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      # `swift test` builds the app target too, so it is also the compile check.
      # Most unit tests cover pure logic (output gates, hotkey matching,
      # spell-check helpers, app policy). Six suites run MLX on the CPU
      # device — HostPLETests, MLXEngineTests, ModelLoadingTests,
      # ModelResidencyTests, GenerationTests and EngineCoordinatorTests: small arrays and a tiny
      # synthetic Gemma, no real model, no GPU kernels. MLX still opens the
      # Metal device for its allocator and loads the metallib `swift build`
      # bundles (the Metal toolchain step above); without a Metal device it
      # aborts the whole test process, so those suites skip themselves when
      # MTLCreateSystemDefaultDevice() is nil (Tests/PretypeTests/MLXTestCase).
      # They have never run on this runner: watch the first push that runs
      # them, and check the log for whether they ran or skipped.
      - name: Test
        run: swift test

      # A `String(localized:)` or SwiftUI literal that never reached
      # Localization/Localizable.xcstrings ships untranslated. The script cannot
      # reuse the test build: it compiles the app module again with the
      # compiler's string extraction, in its own scratch path (.build/l10n,
      # cached with .build). Exits 1 when a key in the code has no translation.
      - name: Check strings
        run: Scripts/sync-strings.py --check

      # Releases are built locally with this same script (docs/RELEASING.md);
      # this catches a broken bundle one merge earlier. PRs skip it: an
      # xcodebuild Release of MLX is minutes, and a compile break already
      # reddens `swift test` above.
      - name: Package app bundle
        if: github.event_name == 'push'
        run: ./Scripts/make-app.sh
